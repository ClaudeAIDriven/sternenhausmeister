name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Godot-Cache
        uses: actions/cache@v4
        with:
          path: ~/tools
          key: godot-4.3-linux
      - name: Selftests
        run: tools/run_tests.sh

  export-windows:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Godot-Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/tools
            ~/.local/share/godot/export_templates
          key: godot-4.3-linux-templates
      - name: Windows-Export
        run: tools/build_windows.sh
      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: StarScrubber-windows
          path: |
            build/StarScrubber.exe
            build/StarScrubber.pck
